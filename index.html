<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 첫 번째 게임</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f8ff; /* 연한 하늘색 배경 */
            font-family: 'Arial', sans-serif;
        }
        h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        #score {
            font-size: 5rem;
            font-weight: bold;
            color: #ff4757;
            margin-bottom: 20px;
        }
        button {
            padding: 20px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 50px; /* 둥근 버튼 */
            box-shadow: 0 9px #a32a35; /* 입체감 */
            cursor: pointer;
            outline: none;
            transition: 0.1s;
        }
        button:active {
            box-shadow: 0 5px #a32a35;
            transform: translateY(4px); /* 눌리는 효과 */
        }
    </style>
</head>
<body>

    <h1>클릭 머신! 🕹️</h1>
    <div id="score">0</div>
    <button onclick="countUp()">나를 눌러봐!</button>

    <script>
        let count = 0;
        function countUp() {
            count = count + 1;
            document.getElementById("score").innerText = count;
        }
    </script>

</body>
</html>
